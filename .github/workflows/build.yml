name: Daamky Build

on:
  push:
    branches: ["**"]
    paths-ignore:
      - ".github/workflows/migrate-mojmap.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 1.21.11 + 26.3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # Install Gradle 9.8.0 for the 26.3 build. The 1.21.11 build below
      # still invokes ./gradlew, so it continues using its pinned 9.5.1 wrapper.
      - name: Setup Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"

      - name: Grant execute permission
        run: chmod +x gradlew mc26/prepare.sh

      - name: Build 1.21.11
        shell: bash
        run: |
          JAVA_HOME="$JAVA_HOME_21_X64" ./gradlew --no-daemon build

      # Loom 1.19.6 requires Gradle 9.8.0+. Use the installed Gradle
      # directly here rather than the repository's 9.5.1 wrapper.
      - name: Build 26.3
        continue-on-error: true
        shell: bash
        run: |
          ./mc26/prepare.sh
          JAVA_HOME="$JAVA_HOME_25_X64" gradle --no-daemon -p mc26 build 2>&1 | tee build-26.3-log.txt

      - name: Collect jars
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p out
          for f in build/libs/*.jar; do
            case "$f" in *-sources.jar|*-dev.jar) ;; *) cp "$f" out/Daamky-1.21.11.jar ;; esac
          done
          for f in mc26/build/libs/*.jar; do
            case "$f" in *-sources.jar|*-dev.jar) ;; *) cp "$f" out/Daamky-26.3.jar ;; esac
          done
          if [ -f build-26.3-log.txt ]; then cp build-26.3-log.txt out/; fi
          ls -la out

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Daamky-Build
          path: out
          if-no-files-found: warn
