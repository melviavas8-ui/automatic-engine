name: Migrate to Mojang mappings (1.21.11)

# Одноразовый запуск вручную: Actions -> Migrate to Mojang mappings -> Run workflow.
# Ничего не коммитит. Результат лежит в артефакте "mojmap-migration".

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Yarn -> Mojang
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Migrate sources (Yarn -> Mojang)
        shell: bash
        run: |
          ./gradlew --no-daemon migrateMappings \
            --mappings "net.minecraft:mappings:1.21.11" \
            --input src/main/java \
            --output remappedSrc 2>&1 | tee migrate-log.txt

      - name: Migrate access widener
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew --no-daemon migrateClassTweakerMappings \
            --mappings "net.minecraft:mappings:1.21.11" 2>&1 | tee migrate-aw-log.txt
          git status --short | tee -a migrate-aw-log.txt

      - name: Compile with Mojang mappings (only to collect errors)
        continue-on-error: true
        shell: bash
        run: |
          rm -rf src/main/java
          cp -r remappedSrc src/main/java
          python3 - <<'PY'
          p = "build.gradle"
          s = open(p, encoding="utf-8").read()
          old = 'mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"'
          assert old in s
          open(p, "w", encoding="utf-8").write(s.replace(old, "mappings loom.officialMojangMappings()"))
          PY
          ./gradlew --no-daemon compileJava 2>&1 | tee build-log.txt

      - name: Pack result
        if: always()
        shell: bash
        run: |
          mkdir -p out
          cp -r remappedSrc out/remappedSrc 2>/dev/null || true
          cp build.gradle out/build.gradle.mojmap 2>/dev/null || true
          cp src/main/resources/*.accesswidener out/ 2>/dev/null || true
          cp migrate-log.txt migrate-aw-log.txt build-log.txt out/ 2>/dev/null || true

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mojmap-migration
          path: out
          if-no-files-found: warn
          retention-days: 7
